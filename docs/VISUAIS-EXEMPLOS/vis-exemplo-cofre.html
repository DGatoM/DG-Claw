<title>Chave da Hostinger</title>
<meta name="description" content="Passo a passo para criar o token da Hostinger e guardá-lo no cofre.">

<h1 class="dv-titulo">Conectar a Hostinger</h1>
<p class="dv-sub">Dois passos. A chave não passa pela conversa.</p>

<ol class="dv-passos">
  <li data-ico="🔑"><b>Crie o token</b><p>No hPanel, abra Perfil, depois API, e crie um token novo.</p></li>
  <li data-ico="🔒"><b>Guarde no cofre</b><p>Toque em Colar a chave e cole o token na caixa que abre embaixo.</p></li>
</ol>

<div class="dv-cofre" data-cofre="HOSTINGER_API_TOKEN"
     data-rotulo="Token da API da Hostinger"
     data-ajuda="hPanel > Perfil > API > Criar token"></div>
