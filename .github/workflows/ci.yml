# Integração contínua do DG Claw.
#
# Cada job cobre uma parte do repositório e roda sozinho, para que uma falha
# apareça com o nome da parte que quebrou. Nada aqui precisa de segredo, de
# podman real ou de acesso a conta de provedor: os testes usam servidores e
# comandos de mentira.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# O CI só lê o código. Sem permissão de escrita, um PR de fora não consegue
# mexer no repositório por esta via.
permissions:
  contents: read

# Um push novo na mesma branch cancela a rodada anterior, para não gastar minutos à toa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Painel (panel/): Express, sem lockfile no repositório, por isso `npm install`.
  # ---------------------------------------------------------------------------
  panel:
    name: panel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Rodar os testes do painel (panel/test-*.mjs)
        shell: bash
        env:
          # O teste usa runner HTTP falso e exige este marcador para recusar chaves reais.
          DGCLAW_TESTE_CHAVE_ANTHROPIC: sk-ant-SEGREDO-DE-TESTE-1234567890abcdef
          DGCLAW_TESTE_CHAVE_OPENAI: sk-SEGREDO-DE-TESTE-9876543210
        run: |
          set -uo pipefail
          falhou=0
          for t in test-*.mjs; do
            echo "::group::$t"
            rc=0
            node "$t" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "ok      $t"
            elif [ "$rc" -eq 3 ] && [ "$t" = "test-provedor.mjs" ]; then
              # Saída 3 indica cobertura incompleta; as chaves acima são apenas fixtures.
              # Mantém o motivo visível caso o contrato do teste mude.
              echo "pulado  $t (sem DGCLAW_TESTE_CHAVE_*)"
            else
              echo "::error file=panel/$t::$t saiu com código $rc. Rode 'node $t' dentro de panel/ para ver o motivo."
              falhou=1
            fi
          done
          exit "$falhou"

  # ---------------------------------------------------------------------------
  # DG Claw Web (web/): zero dependências, só o test runner nativo do Node.
  # ---------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Preparar geração real de miniaturas
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Rodar os testes do web
        run: node --test web/test/

  # ---------------------------------------------------------------------------
  # Runner (runner/): TypeScript com node-pty (compila módulo nativo no install).
  # ---------------------------------------------------------------------------
  runner:
    name: runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - name: Instalar dependências (lockfile exato)
        run: npm ci --no-audit --no-fund
      - name: Conferir os tipos
        run: npx tsc --noEmit
      - name: Rodar os testes do runner, se existirem
        shell: bash
        run: |
          # Hoje o package.json do runner não tem o script "test"; outro card vai pôr.
          # Quando ele aparecer, este passo passa a rodar sem ninguém mexer no CI.
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "pulado: runner/package.json ainda não tem o script test"
          fi

  # ---------------------------------------------------------------------------
  # Cobertura: roda de novo os testes do web e do runner com a cobertura nativa do Node
  # (sem dependência extra), mostra o percentual de linhas no resumo da rodada, guarda os lcov
  # como artefato e gera o cobertura.json no formato do endpoint do shields.io.
  # Fica separado dos jobs web e runner (que são checks obrigatórios) para não os atrasar.
  # Os arquivos de teste não entram na conta, só o código que eles exercitam.
  # ---------------------------------------------------------------------------
  cobertura:
    name: cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - name: Preparar geração real de miniaturas
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Cobertura do web
        run: |
          mkdir -p cobertura
          node --test --experimental-test-coverage \
            --test-coverage-exclude='**/test/**' --test-coverage-exclude='**/*.test.*' \
            --test-reporter=spec --test-reporter-destination=cobertura/web.spec.txt \
            --test-reporter=lcov --test-reporter-destination=cobertura/web.lcov \
            web/test/
      - name: Cobertura do runner
        working-directory: runner
        run: |
          npm ci --no-audit --no-fund
          npx tsc
          node --test --experimental-test-coverage \
            --test-coverage-exclude='**/*.test.js' --test-coverage-exclude='**/apoio-teste.js' \
            --test-reporter=spec --test-reporter-destination=../cobertura/runner.spec.txt \
            --test-reporter=lcov --test-reporter-destination=../cobertura/runner.lcov \
            "dist/**/*.test.js"
      - name: Resumo e selo de cobertura
        shell: bash
        run: bash scripts/ci-cobertura.sh cobertura
      - name: Guardar os lcov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: cobertura/
          retention-days: 30

  # Só em push na main: grava o cobertura.json no branch órfão "badges", de onde o shields.io lê
  # (https://raw.githubusercontent.com/<dono>/<repo>/badges/cobertura.json). É um job à parte
  # para que a permissão de escrita nunca exista no job que roda o código de um pull request;
  # ele só baixa o artefato pronto e não executa nada do repositório.
  cobertura-selo:
    name: cobertura-selo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura
          path: cobertura
      - name: Gravar cobertura.json no branch badges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cabecalho="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q selo
          cd selo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          rc=0
          git -c http.extraheader="$cabecalho" ls-remote --exit-code --heads origin badges >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git -c http.extraheader="$cabecalho" fetch -q --depth=1 origin badges
            git checkout -q -b badges FETCH_HEAD
          elif [ "$rc" -eq 2 ]; then
            echo "branch badges ainda não existe: criando órfão"
            git checkout -q --orphan badges
          else
            echo "::error::não consegui consultar o branch badges em ${GITHUB_REPOSITORY} (git ls-remote saiu com $rc). Veja se o token tem contents: write e se o GitHub está no ar."
            exit 1
          fi
          cp ../cobertura/cobertura.json cobertura.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cobertura.json
          if git diff --cached --quiet; then
            echo "cobertura.json já está igual: nada a gravar"
            exit 0
          fi
          git commit -q -m "chore: atualiza o selo de cobertura"
          git -c http.extraheader="$cabecalho" push -q origin HEAD:badges

  # ---------------------------------------------------------------------------
  # Python: os testes são scripts executáveis (saem com código diferente de zero
  # se falharem), não suítes unittest. Por isso cada arquivo roda direto.
  # ---------------------------------------------------------------------------
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Rodar os testes Python
        shell: bash
        run: |
          set -uo pipefail
          falhou=0
          for t in scripts/_lib/test_*.py scripts/test_*.py scripts/memory_index/test_*.py; do
            [ -e "$t" ] || continue
            echo "::group::$t"
            python3 "$t"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "ok      $t"
            else
              echo "::error file=$t::$t saiu com código $rc. Rode 'python3 $t' na raiz do repositório para ver o motivo."
              falhou=1
            fi
          done
          exit "$falhou"

  # ---------------------------------------------------------------------------
  # Shell: shellcheck (já vem instalado no ubuntu-24.04).
  #
  # Arquivos da v1 (lib/, bin/dgclaw, bin/dgclaw-agente, install.sh, tests/cli)
  # passam na severidade padrão. Os scripts/*.sh herdados passam na severidade
  # "warning" (erros e avisos, sem as sugestões de estilo).
  #
  # Ficam fora, por acusarem avisos antigos que ainda não foram tratados:
  #   scripts/bootstrap-identity.sh        SC2064 (trap com aspas duplas)
  #   scripts/launch.sh                    SC2064 (trap com aspas duplas)
  #   scripts/install-core.sh              SC1090 (source de caminho dinâmico)
  #   scripts/migrate-alive.sh             SC1090 (source de caminho dinâmico)
  #   scripts/reflection.sh                SC2034 (variável sem uso)
  #   scripts/memory_index/hook-memory-inject.sh   SC2034 (variável sem uso)
  #   bin/test/dgclaw-agente.test.sh       23 avisos (teste da v1, a limpar)
  # Quando um deles ficar limpo, tire da lista abaixo.
  # ---------------------------------------------------------------------------
  shell:
    name: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versão do shellcheck
        run: shellcheck --version
      - name: shellcheck nos arquivos da v1
        shell: bash
        run: |
          set -euo pipefail
          arquivos=(lib/*.sh bin/dgclaw bin/dgclaw-agente tests/cli/*.sh)
          # install.sh vem de outro card: só entra quando existir.
          [ -f install.sh ] && arquivos+=(install.sh)
          shellcheck -x "${arquivos[@]}"
      - name: shellcheck nos scripts herdados (severidade warning)
        shell: bash
        run: |
          set -euo pipefail
          antigos=(
            scripts/bootstrap-identity.sh
            scripts/launch.sh
            scripts/install-core.sh
            scripts/migrate-alive.sh
            scripts/reflection.sh
            scripts/memory_index/hook-memory-inject.sh
          )
          arquivos=()
          while IFS= read -r f; do
            pular=0
            for a in "${antigos[@]}"; do [ "$f" = "$a" ] && pular=1; done
            [ "$pular" -eq 0 ] && arquivos+=("$f")
          done < <(git ls-files 'scripts/*.sh')
          echo "conferindo ${#arquivos[@]} scripts"
          shellcheck -x -S warning "${arquivos[@]}"

  # ---------------------------------------------------------------------------
  # CLI: testes de bin/dgclaw e bin/dgclaw-agente com podman e systemctl de mentira
  # (tests/cli/stubs). Nada toca o sistema do runner.
  # ---------------------------------------------------------------------------
  cli:
    name: cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Testes do dgclaw (tests/cli)
        # A bancada confere uid 0 e arquivos 0444 numa raiz temporária com comandos falsos.
        # Precisa de root para exercitar essas permissões, sem instalar serviços no runner.
        run: sudo env "PATH=$PATH" bash tests/cli/rodar.sh
      - name: Testes do dgclaw-agente
        run: bash bin/test/dgclaw-agente.test.sh
