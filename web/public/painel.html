<body>
<!-- O painel do agente roda aqui dentro, numa origem opaca (sem allow-same-origin): o JavaScript dele não alcança o cookie
     nem a API do Web. O endereço (src) é posto pelo painel-moldura.js com um token novo a cada abertura. -->
<iframe id="painelQuadro" title="Painel do agente"
  sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"
  allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<p id="painelErro" role="alert" hidden></p>
<script src="/tour.js"></script>
<script src="/menu-lado.js"></script>
<script src="/casca.js"></script>
<script src="/painel-moldura.js"></script>
</body>
