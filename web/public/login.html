<!doctype html>
<html lang="pt-BR" data-tema="{{MARCA_TEMA}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Entrar - {{MARCA_NOME}}</title>
<meta name="marca-nome" content="{{MARCA_NOME}}">
<meta name="marca-logo-tem-nome" content="{{MARCA_LOGO_TEM_NOME}}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{MARCA_COR_TEMA}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{MARCA_NOME}}">
<link rel="apple-touch-icon" href="/marca/icone-app">
<link rel="icon" href="/marca/favicon">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/componentes.css">
<link rel="stylesheet" href="/ds/carregando.css">
<link rel="stylesheet" href="/marca.css">
<link rel="stylesheet" href="/login.css">
<link rel="stylesheet" href="/sem-zoom.css">
<script src="/ds/marca.js"></script>
<script src="/ds/icone.js"></script>
<script src="/ds/carregando.js"></script>
<script src="/sem-zoom.js"></script>
</head>
<body>
<main class="cartao">
  <div class="marca"><img class="marca-logo" src="/marca/logo" alt="" width="56" height="56"><span class="marca-nome">{{MARCA_NOME}}</span></div>
  <h1>{{MARCA_TITULO_LOGIN}}</h1>
  <div id="erro" class="erro" role="alert" hidden></div>
  <form method="post" action="/login" id="form" autocomplete="on">
    <input type="hidden" name="next" id="next" value="/">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none"
           autocorrect="off" spellcheck="false" required autofocus>
    <label for="campoSenha">Senha</label>
    <div class="campo-senha">
      <input id="campoSenha" name="senha" type="password" autocomplete="current-password" required>
      <button type="button" class="ver-senha" id="verSenha" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha"><svg class="ds-ico" aria-hidden="true"><use href="/ds/icones.svg#i-eye"/></svg></button>
    </div>
    <button type="submit" id="entrar">Entrar</button>
  </form>
  <p class="slogan">{{MARCA_SLOGAN}}</p>
</main>
<script src="/login.js"></script>
</body>
</html>
