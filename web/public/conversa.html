/* App instalado (Tela de Início) ou navegador? Decidido antes da primeira
   pintura: no navegador a barra precisa ficar acima da barra do Safari; no app
   instalado não existe essa barra, e a folga virava uma faixa branca embaixo. */

}

<script>
/* Teclado do iPhone (o teclado, a barra de sugestões ou a de preenchimento
   podia cobrir a caixa de texto).
   No iOS o teclado NÃO encolhe a página: o sistema só desliza a parte visível
   pra cima. A versão antiga voltava a janela pro topo a cada mudança de tamanho
   e desfazia esse deslize; quando a barra de sugestões aparecia depois do
   foco, a caixa ia parar atrás dela. Agora a tela segue a área visível de
   verdade (visualViewport): o corpo tem a altura e a posição dela, então a
   barra de digitar fica sempre logo acima do que subir de baixo. */
(function(){
  var vv = window.visualViewport, raiz = document.documentElement;
  if (!vv) return;
  var chat = document.getElementById('chat');
  var agendado = false;
  function ajusta(){
    agendado = false;
    // com zoom de pinça a área visível encolhe por causa do zoom, não do
    // teclado: aí a tela volta ao normal em vez de espremer o corpo
    if (Math.abs((vv.scale || 1) - 1) > 0.01) {
      raiz.classList.remove('vv', 'teclado');
      return;
    }
    /* Sem campo em foco não existe teclado: a tela volta pro tamanho cheio do
       CSS (100dvh ou o fixed do app instalado). Antes a altura medida ficava
       valendo depois do teclado fechar e, quando o iOS não avisava a volta, a
       tela ficava presa curta com um branco embaixo . */
    var ativo = document.activeElement;
    var digitando = !!ativo && (ativo.isContentEditable ||
      /^(INPUT|TEXTAREA|SELECT)$/.test(ativo.tagName));
    if (!digitando) {
      raiz.classList.remove('vv', 'teclado');
      if (window.scrollY || vv.offsetTop) { try { window.scrollTo(0, 0); } catch(e){} }
      return;
    }
    var perto = chat ? chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80 : false;
    var h = Math.round(vv.height), topo = Math.round(vv.offsetTop);
    var teclado = window.innerHeight - h > 120;
    raiz.style.setProperty('--app-h', h + 'px');
    raiz.style.setProperty('--app-top', topo + 'px');
    raiz.classList.add('vv');
    raiz.classList.toggle('teclado', teclado);
    // fechou o teclado e a janela ficou deslocada: volta pro zero
    if (!teclado && (window.scrollY || topo)) { try { window.scrollTo(0, 0); } catch(e){} }
    if (perto && chat) chat.scrollTop = chat.scrollHeight;
  }
  function agenda(){ if (!agendado) { agendado = true; requestAnimationFrame(ajusta); } }
  vv.addEventListener('resize', agenda);
  vv.addEventListener('scroll', agenda);
  window.addEventListener('orientationchange', function(){ setTimeout(ajusta, 300); });
  /* A barra de sugestões e a de preenchimento entram DEPOIS do foco e nem
     sempre avisam. Enquanto um campo está em foco, confere a área visível a
     cada 0,4 s e só reajusta se ela mudou (custa uma leitura de número). */
  var vigia = null, visto = '';
  function confere(){
    var agora = Math.round(vv.height) + ':' + Math.round(vv.offsetTop) + ':' + vv.scale;
    if (agora !== visto) { visto = agora; ajusta(); }
  }
  document.addEventListener('focusin', function(){
    [50, 250].forEach(function(ms){ setTimeout(ajusta, ms); });
    if (!vigia) vigia = setInterval(confere, 400);
  });
  document.addEventListener('focusout', function(){
    if (vigia) { clearInterval(vigia); vigia = null; }
    [80, 400, 900, 1600].forEach(function(ms){ setTimeout(ajusta, ms); });
  });
  window.addEventListener('pageshow', function(){ setTimeout(ajusta, 50); });
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) setTimeout(ajusta, 50);
  });
  ajusta();
})();
</script>
