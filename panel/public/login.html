<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DG Claw - entrar no painel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <style>
    /* Mesma linguagem do painel: tema do sistema, acento em gradiente, sombra fraca.
       Nada vem de fora, entao a tela de login abre sem internet de saida. */
    :root{
      --acento1:#4f46e5; --acento2:#8b5cf6;
      --bg:#f6f7fb; --painel:#fff; --linha:#e6e8f0; --texto:#1a1c25; --fraco:#6b7185;
      --erro:#dc2b46; --sombra:0 1px 2px rgba(16,20,40,.04), 0 12px 34px rgba(16,20,40,.08);
    }
    @media (prefers-color-scheme:dark){
      :root{ --bg:#0e1017; --painel:#161923; --linha:#262b3a; --texto:#e9ebf2; --fraco:#9aa1b5;
             --erro:#ff6b81; --sombra:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.4); }
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
         background:var(--bg);color:var(--texto);
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .caixa{width:100%;max-width:360px;background:var(--painel);border:1px solid var(--linha);
           border-radius:16px;box-shadow:var(--sombra);padding:30px 28px;text-align:center}
    .moldura{position:relative;width:104px;height:104px;margin:0 auto 16px;display:grid;place-items:center}
    .moldura::before{content:"";position:absolute;inset:0;border-radius:50%;
      background:conic-gradient(from 210deg,var(--acento1),var(--acento2),var(--acento1))}
    .moldura::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--painel)}
    .avatar{position:relative;z-index:1;width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--bg)}
    h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
    .sub{color:var(--fraco);font-size:13px;margin:0 0 22px}
    input{width:100%;padding:11px 14px;border:1px solid var(--linha);border-radius:10px;
          background:var(--bg);color:var(--texto);font-size:15px}
    input:focus{outline:2px solid color-mix(in srgb,var(--acento1) 45%,transparent);outline-offset:1px}
    button{width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:10px;cursor:pointer;
           background:linear-gradient(135deg,var(--acento1),var(--acento2));color:#fff;font-size:15px;font-weight:600}
    button:hover{filter:brightness(1.05)}
    .erro{color:var(--erro);font-size:13px;margin-bottom:12px}
    .rodape{color:var(--fraco);font-size:12px;margin-top:20px}
    input + input{margin-top:10px}
    .trancado{text-align:left;font-size:13.5px;border:1px solid var(--erro);border-radius:10px;padding:12px 14px}
    .trancado p{margin:0 0 8px} .trancado p:last-child{margin-bottom:0}
    /* O servidor preenche o data-modo do body e o CSS mostra só o que cabe: trancado (sem
       senha configurada) esconde o formulário; sem usuário configurado, o campo some. */
    body[data-modo="trancado"] form{display:none}
    body:not([data-modo="trancado"]) .trancado{display:none}
    body:not([data-modo="usuario"]) #campo-usuario{display:none}
  </style>
</head>
<body data-modo="{{LOGIN_MODO}}" data-erro="{{LOGIN_ERRO}}">
  <div class="caixa">
    <div class="moldura"><img src="{{BASE}}/assets/sprites/avatar.jpg" alt="" class="avatar"></div>
    <h1>Painel do agente</h1>
    <p class="sub">só quem tem a senha entra aqui</p>
    <form method="POST" action="{{BASE}}/login">
      <div id="erro" class="erro" style="display:none"></div>
      <input type="text" id="campo-usuario" name="user" placeholder="usuário" autocomplete="username" title="O usuário que quem administra a máquina definiu para este painel.">
      <input type="password" name="password" placeholder="senha do painel" autofocus autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
    <div class="trancado">
      <p><strong>Este painel está trancado.</strong></p>
      <p>{{LOGIN_MOTIVO}}</p>
      <p>Para destrancar: {{LOGIN_COMO}}</p>
    </div>
    <p class="rodape">DG Claw</p>
  </div>
  <script>
    (function () {
      var caixa = document.getElementById('erro');
      var texto = '';
      var bloqueado = /^bloqueado:(\d+)$/.exec(document.body.dataset.erro || '');
      var q = new URLSearchParams(location.search);
      if (bloqueado || q.get('error') === 'bloqueado') {
        var min = bloqueado ? bloqueado[1] : (q.get('min') || '15');
        texto = 'Muitas tentativas erradas. Espere ' + min + ' minuto' + (min === '1' ? '' : 's') + '.';
      } else if (q.get('error') === '1') {
        texto = document.body.dataset.modo === 'usuario' ? 'Usuário ou senha incorretos. Tente de novo.' : 'Senha incorreta. Tente de novo.';
      }
      if (texto) { caixa.textContent = texto; caixa.style.display = 'block'; }
      var primeiro = document.body.dataset.modo === 'usuario' ? 'campo-usuario' : null;
      if (primeiro) document.getElementById(primeiro).focus();
    })();
  </script>
</body>
</html>
